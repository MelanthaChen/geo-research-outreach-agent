name: GEO report quality
on:
  pull_request:
  push:
    branches: [codex/outreach-platform-rebuild]
jobs:
  report-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_report_versioning.py tests/test_report_content_quality.py -q
      - run: python scripts/build_report_qa_fixture.py
      - run: python scripts/docx_report_qa.py /tmp/geo-report-qa-fixture.docx
