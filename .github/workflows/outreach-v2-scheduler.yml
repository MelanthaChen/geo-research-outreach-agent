name: Outreach V2 consent and research worker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outreach-v2-worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ingest verified Forms responses and run at most the exact allowlisted job
        env:
          WORKER_URL: ${{ secrets.OUTREACH_STAGING_URL }}
          WORKER_TOKEN: ${{ secrets.OUTREACH_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_TOKEN" ]]; then
            echo 'Required repository secrets are not configured.'
            exit 1
          fi
          case "$WORKER_URL" in
            https://*) ;;
            *) echo 'Worker URL must use HTTPS.'; exit 1 ;;
          esac
          response_file="$RUNNER_TEMP/outreach-worker-response.json"
          status_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 660 --request POST \
            --header "Authorization: Bearer ${WORKER_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"max_jobs":1}' \
            "${WORKER_URL%/}/api/internal/worker-tick")"
          if [[ "$status_code" != '200' ]]; then
            echo "Worker returned HTTP ${status_code}; inspect the persisted run before retrying."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as response:
              result = json.load(response)
          status = result.get('status')
          invocation = result.get('invocation_status')
          consent = result.get('subsystems', {}).get('consent', {}).get('status')
          print('worker_run_id=' + str(result.get('worker_run_id', 'missing')))
          print('status=' + str(status))
          print('consent_status=' + str(consent))
          print('processed_stages=' + str(result.get('processed_stages', 'unknown')))
          if status != 'COMPLETED' or invocation != 'COMPLETED' or consent != 'COMPLETED':
              raise SystemExit('Worker reported an incomplete or failed consent invocation; inspect persisted diagnostics.')
          PY
