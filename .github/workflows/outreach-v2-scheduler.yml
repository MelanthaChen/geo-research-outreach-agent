name: Outreach V2 consent and research worker

on:
  schedule:
    # Offset from the top of the hour, where GitHub reports more schedule delays.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outreach-v2-worker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke the authenticated, bounded worker
        env:
          WORKER_URL: ${{ secrets.OUTREACH_STAGING_URL }}
          WORKER_TOKEN: ${{ secrets.OUTREACH_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_TOKEN" ]]; then
            echo 'Required repository secrets are not configured.'
            exit 1
          fi
          case "$WORKER_URL" in
            https://*) ;;
            *) echo 'Worker URL must use HTTPS.'; exit 1 ;;
          esac
          response_file="$RUNNER_TEMP/outreach-worker-response.json"
          status_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 480 \
            --request POST \
            --header "Authorization: Bearer ${WORKER_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"max_jobs":1}' \
            "${WORKER_URL%/}/api/internal/worker-tick")"
          if [[ "$status_code" == '409' ]]; then
            echo 'A database-locked worker invocation is already active.'
            exit 0
          fi
          if [[ "$status_code" != '200' ]]; then
            echo "Worker returned HTTP ${status_code}."
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as response:
              result = json.load(response)
          print('Worker run:', result.get('worker_run_id', 'missing'))
          print('Worker status:', result.get('status', 'missing'))
          print('Processed stages:', result.get('processed_stages', 'missing'))
          if result.get('status') != 'COMPLETED':
              raise SystemExit('Worker requires attention; inspect the persisted run before retrying.')
          PY
