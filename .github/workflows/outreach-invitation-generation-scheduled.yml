name: Outreach durable invitation generation (scheduled)

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

# Share the same serialization key as the manual workflow. The database
# advisory lock remains the cross-workflow/process concurrency boundary.
concurrency:
  group: outreach-invitation-generation
  cancel-in-progress: false

jobs:
  generate-review-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process bounded invitation-generation work
        env:
          WORKER_URL: ${{ secrets.OUTREACH_STAGING_URL }}
          WORKER_TOKEN: ${{ secrets.OUTREACH_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_TOKEN" ]]; then
            echo 'Required repository secrets are not configured.'
            exit 1
          fi
          case "$WORKER_URL" in
            https://*) ;;
            *) echo 'Worker URL must use HTTPS.'; exit 1 ;;
          esac
          response_file="$RUNNER_TEMP/invitation-generation-response.json"
          status_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 180 --request POST \
            --header "Authorization: Bearer ${WORKER_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}' "${WORKER_URL%/}/api/internal/invitation-generation-tick")"
          if [[ "$status_code" != '200' ]]; then
            echo "Invitation generation worker returned HTTP ${status_code}."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as response:
              result = json.load(response)
          print('status=' + str(result.get('status', 'unknown')))
          print('processed_chunks=' + str(result.get('processed_chunks', 0)))
          if result.get('status') == 'ATTENTION_REQUIRED':
              raise SystemExit('Invitation generation requires recovery; inspect the Admin Invitations page.')
          PY
