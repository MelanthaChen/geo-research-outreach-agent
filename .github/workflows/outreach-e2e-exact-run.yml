name: Outreach exact E2E invocation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select exact response ingestion or exact job stage
        required: true
        type: choice
        options: [ingest_response, run_job]
      response_id:
        description: Exact Google Forms response ID (ingestion mode only)
        required: false
        type: string
      response_reference:
        description: Exact invitation reference (ingestion mode only)
        required: false
        type: string
      job_id:
        description: Exact Outreach job ID (job mode only)
        required: false
        type: string
      idempotency_key:
        description: Exact Outreach idempotency key (job mode only)
        required: false
        type: string
      stage:
        description: Exact job stage (job mode only)
        required: false
        type: choice
        options: [RESEARCH, REPORT]
permissions:
  contents: read
concurrency:
  group: outreach-e2e-exact-invocation
  cancel-in-progress: false
jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact selector and invoke one bounded stage
        shell: bash
        env:
          WORKER_URL: ${{ secrets.OUTREACH_STAGING_URL }}
          WORKER_TOKEN: ${{ secrets.OUTREACH_WORKER_TOKEN }}
          MODE: ${{ inputs.mode }}
          RESPONSE_ID: ${{ inputs.response_id }}
          RESPONSE_REFERENCE: ${{ inputs.response_reference }}
          JOB_ID: ${{ inputs.job_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_TOKEN" ]]; then
            echo 'Required worker secrets are not configured.'
            exit 1
          fi
          case "$WORKER_URL" in https://*) ;; *) echo 'Worker URL must use HTTPS.'; exit 1 ;; esac
          payload_file="$RUNNER_TEMP/outreach-exact-request.json"
          python3 - "$payload_file" <<'PY'
          import json, os, sys
          mode=os.environ['MODE']
          if mode=='ingest_response':
              response_id=os.environ.get('RESPONSE_ID','').strip()
              reference=os.environ.get('RESPONSE_REFERENCE','').strip()
              if bool(response_id)==bool(reference) or os.environ.get('JOB_ID','').strip() or os.environ.get('IDEMPOTENCY_KEY','').strip():
                  raise SystemExit('Ingestion mode requires exactly one response selector and no job selector.')
              body={'max_jobs':0}
              if response_id: body['response_id']=response_id
              else: body['response_reference']=reference
          elif mode=='run_job':
              job_id=os.environ.get('JOB_ID','').strip()
              key=os.environ.get('IDEMPOTENCY_KEY','').strip()
              stage=os.environ.get('STAGE','').strip()
              if not job_id or not key or stage not in {'RESEARCH','REPORT'} or os.environ.get('RESPONSE_ID','').strip() or os.environ.get('RESPONSE_REFERENCE','').strip():
                  raise SystemExit('Job mode requires exact job ID, key, stage, and no response selector.')
              body={'max_jobs':1,'job_id':job_id,'idempotency_key':key,'stage':stage}
          else: raise SystemExit('Unknown invocation mode.')
          with open(sys.argv[1],'w',encoding='utf-8') as f: json.dump(body,f,separators=(',',':'))
          PY
          response_file="$RUNNER_TEMP/outreach-exact-response.json"
          status_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 180 --request POST \
            --header "Authorization: Bearer $WORKER_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$payload_file" "${WORKER_URL%/}/api/internal/worker-tick")"
          echo "worker_http_status=$status_code"
          if [[ "$status_code" != '200' ]]; then
            echo 'Exact worker invocation failed; inspect persisted run evidence. Do not automatically retry.'
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json,os,sys
          with open(sys.argv[1],encoding='utf-8') as f: result=json.load(f)
          print('invocation_status='+str(result.get('invocation_status','unknown')))
          print('worker_run_id='+str(result.get('worker_run_id','unknown')))
          print('processed_stages='+str(result.get('processed_stages','unknown')))
          print('status='+str(result.get('status','unknown')))
          if result.get('invocation_status')!='COMPLETED' or result.get('status')!='COMPLETED':
              raise SystemExit('Invocation is not confirmed complete; no automatic retry.')
          if os.environ.get('MODE')=='ingest_response':
              consent=result.get('subsystems',{}).get('consent',{}).get('status')
              print('consent_status='+str(consent))
              if consent!='COMPLETED':
                  raise SystemExit('Selected Forms response ingestion is incomplete; inspect persisted diagnostics.')
          PY
