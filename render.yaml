services:
  - type: web
    name: geo-research-outreach
    runtime: python
    plan: free
    buildCommand: pip install '.[gmail,cloud]'
    startCommand: python scripts/run_outreach_v2.py serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OUTREACH_ALLOW_REMOTE
        value: "true"
      - key: OUTREACH_DATABASE_URL
        sync: false
      - key: OUTREACH_REGISTRY_MODE
        value: "LEAN"
      - key: OUTREACH_DATABASE_MIGRATION_URL
        sync: false
      - key: GEO_ENGINE_API_URL
        sync: false
      - key: GEO_ENGINE_HANDOFF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OUTREACH_AI_PERSONALIZATION_ENABLED
        value: "false"
      - key: OUTREACH_AI_PERSONALIZATION_MODEL
        value: "gpt-5.4-mini-2026-03-17"
      - key: OUTREACH_AI_PERSONALIZATION_MAX_CANDIDATES_PER_RUN
        value: "5"
      - key: OUTREACH_AI_PERSONALIZATION_RUN_BUDGET_USD
        value: "0"
      - key: OUTREACH_AI_PERSONALIZATION_CUMULATIVE_BUDGET_USD
        value: "0"
      - key: OUTREACH_AI_PERSONALIZATION_MAX_COST_PER_CANDIDATE_USD
        value: "0"
      - key: OUTREACH_AI_PERSONALIZATION_REPROCESS_ENABLED
        value: "false"
      - key: OUTREACH_AI_PERSONALIZATION_REPROCESS_CANDIDATE_IDS
        value: ""
      - key: OUTREACH_AI_PERSONALIZATION_COHORT_CANDIDATE_IDS
        value: ""
      - key: OUTREACH_AI_PERSONALIZATION_SCHEDULED_ENABLED
        value: "false"
      - key: OUTREACH_DASHBOARD_TOKEN
        generateValue: true
      - key: OUTREACH_ADMIN_EMAIL
        value: "chen.yuxuan9@northeastern.edu"
      - key: OUTREACH_ADMIN_PASSWORD_HASH
        sync: false
      - key: OUTREACH_COOKIE_SECURE
        value: "true"
      - key: RESEARCH_QUESTIONNAIRE_SECRET
        generateValue: true
      - key: RESEARCH_QUESTIONNAIRE_BASE_URL
        sync: false
      - key: OUTREACH_OWNER_TEST_AUTOMATION_ENABLED
        value: "true"
      - key: GEO_RESEARCH_SERVICE_ACCOUNT_JSON_B64
        sync: false

  - type: cron
    name: geo-research-sheets-sync
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install '.[gmail,cloud]'
    startCommand: python scripts/sync_google_form_responses.py --registry "$OUTREACH_DATABASE_URL"
    autoDeploy: false
    envVars:
      - key: OUTREACH_DATABASE_URL
        sync: false
      - key: OUTREACH_REGISTRY_MODE
        value: "LEAN"
      - key: GEO_RESEARCH_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GEO_RESEARCH_SHEETS_RANGE
        value: "Form Responses 1!A:Z"

  # Prepared but disabled by default. Enabling requires staging, source-term,
  # rate-limit, and yield review.
  - type: cron
    name: geo-hotel-prospect-discovery
    runtime: python
    plan: starter
    schedule: "17 * * * *"
    buildCommand: pip install '.[cloud]'
    startCommand: 'if [ "$HOTEL_DISCOVERY_ENABLED" = "true" ]; then python scripts/hotel_prospect_job.py run --registry "$OUTREACH_DATABASE_URL" --source-mode "$HOTEL_DISCOVERY_SOURCE_MODE"; else echo "hotel discovery disabled"; fi'
    autoDeploy: false
    envVars:
      - key: OUTREACH_DATABASE_URL
        sync: false
      - key: OUTREACH_REGISTRY_MODE
        value: "LEAN"
      - key: HOTEL_DISCOVERY_ENABLED
        value: "false"
      - key: HOTEL_DISCOVERY_SOURCE_MODE
        value: "OVERPASS"
      - key: HOTEL_PROSPECT_TARGET
        value: "1000"
      - key: HOTEL_DISCOVERY_BATCH_SIZE
        value: "25"
      - key: HOTEL_DISCOVERY_SOURCE
        sync: false
