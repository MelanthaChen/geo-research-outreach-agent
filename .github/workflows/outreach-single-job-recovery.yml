name: Outreach single-job recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outreach-v2-single-job-recovery
  cancel-in-progress: false
jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Invoke exactly one guarded worker tick
        shell: bash
        env:
          WORKER_URL: ${{ secrets.OUTREACH_STAGING_URL }}
          WORKER_TOKEN: ${{ secrets.OUTREACH_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_URL" || -z "$WORKER_TOKEN" ]]; then
            echo 'Required worker secrets are not configured.'
            exit 1
          fi
          case "$WORKER_URL" in
            https://*) ;;
            *) echo 'Worker URL must use HTTPS.'; exit 1 ;;
          esac
          response_file="$RUNNER_TEMP/worker-response.json"
          status_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $WORKER_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"max_jobs":1}' \
            "${WORKER_URL%/}/api/internal/worker-tick")"
          echo "worker_http_status=$status_code"
          if [[ "$status_code" != '200' ]]; then
            echo 'Worker invocation did not return HTTP 200; inspect persisted run evidence.'
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              result = json.load(f)
          print('invocation_status=' + str(result.get('invocation_status', 'unknown')))
          print('worker_run_id=' + str(result.get('worker_run_id', 'unknown')))
          if result.get('invocation_status') != 'COMPLETED':
              raise SystemExit('Worker invocation is not confirmed completed; no automatic retry.')
          PY
